<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<title>SCOOP – Kaffeekasse</title>
<style>
:root{--bg:#e8eef1;--card:#fff;--ink:#16252e;--mute:#5b6e79;--brand:#6b3f22;--onbrand:#fff;--accent:#1f7a8c;--track:#c9d6dc;--ok:#1c7a43;--err:#b3261e;--warn:#fff3c4;--r:20px}
@media(prefers-color-scheme:dark){:root{--bg:#10191f;--card:#1a2a33;--ink:#eaf1f4;--mute:#97aab4;--brand:#e3a56b;--onbrand:#24150b;--accent:#5fc3d6;--track:#33505e;--ok:#6fd49a;--err:#ff8a80;--warn:#4a3d10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;padding:12px 14px;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
h2{margin:0 0 4px;font-size:1.25rem}
.card{background:var(--card);border-radius:var(--r);padding:18px;display:grid;gap:14px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.mute{color:var(--mute);font-size:.9rem;margin:0}
.net{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:.95rem;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:var(--r);min-height:64px;padding:0 20px;cursor:pointer;background:var(--brand);color:var(--onbrand);font-size:1.25rem;width:100%}
button.sec{background:transparent;color:var(--ink);border:2px solid var(--track);font-size:1rem;min-height:56px}
button.sm{width:auto;min-height:48px;font-size:1rem;padding:0 14px}
button:disabled{opacity:.4;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{text-align:center;padding:26px 18px}
.big{font-size:5.5rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.row{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.row button{min-height:56px;padding:0;font-size:1.8rem}
.val{text-align:center;font-size:1.6rem;font-weight:800}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;background:var(--track);margin:14px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:48px;border-radius:50%;background:var(--brand);border:4px solid var(--card);box-shadow:0 0 0 2px var(--brand)}
input[type=range]::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:var(--brand);border:4px solid var(--card)}
.wl{display:grid;gap:10px}
.hint{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:.95rem}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:456px;margin:auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 18px;font-weight:600;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#toast.ok{background:var(--ok);color:#fff}#toast.err{background:var(--err);color:#fff}#toast a{color:inherit}
.off{opacity:.45;pointer-events:none}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
input[type=number]{width:100%;min-height:60px;font:inherit;font-size:1.4rem;font-weight:700;text-align:center;border-radius:var(--r);border:2px solid var(--track);background:var(--bg);color:var(--ink)}
.adm{border:3px dashed var(--accent)}
#network{background:none;color:inherit;border-radius:0;padding:0;font-size:inherit;font-weight:inherit}
</style>
</head>
<body>
<main>
<div id="net" class="net hide">🧪 TESTNETZ – kein echtes Geld</div>
<header><h1>SCOOP ☕</h1><button id="who" class="sec sm hide"></button></header>

<section class="card hero">
  <div id="connect" class="wl"></div>
  <div id="bal" class="hide">
    <div class="big" id="cups">–</div>
    <div style="font-size:1.3rem;font-weight:700">Tassen übrig</div>
    <p class="mute" id="scoops"></p>
  </div>
</section>

<div id="bad" class="hint hide">⚠️ Kassen-Abweichung: <span id="badMsg"></span></div>

<section class="card off" id="payCard">
  <h2>Kaffee verbuchen</h2>
  <div class="row"><button class="sec" data-s="cup" data-d="-1" aria-label="weniger">−</button><div class="val" id="cupV"></div><button class="sec" data-s="cup" data-d="1" aria-label="mehr">+</button></div>
  <input type="range" id="cup" min="1" max="20" step="1" value="5" aria-label="Löffel Kaffee">
  <button id="pay"></button>
  <button class="sec" id="save">★ Als meine Tasse merken</button>
</section>

<section class="card off" id="buyCard">
  <div><h2>Guthaben aufladen</h2><p class="mute">Immer hier aufladen, niemals direkt an die Kasse überweisen – dafür gibt es kein SCOOP.</p></div>
  <div class="row"><button class="sec" data-s="buy" data-d="-1" aria-label="weniger">−</button><div class="val" id="buyV"></div><button class="sec" data-s="buy" data-d="1" aria-label="mehr">+</button></div>
  <input type="range" id="buy" min="1" max="30" step="1" value="5" aria-label="EURC">
  <p class="mute" id="buyP" style="text-align:center;font-size:1.05rem"></p>
  <div id="hints"></div>
  <button id="buyB">Aufladen</button>
</section>

<section class="card adm hide" id="admCard">
  <h2>🔧 Admin</h2>
  <h2 style="margin-top:0">EURC abheben</h2>
  <div class="row"><button class="sec" data-s="wd" data-d="-1" aria-label="weniger">−</button><div class="val" id="wdV"></div><button class="sec" data-s="wd" data-d="1" aria-label="mehr">+</button></div>
  <input type="range" id="wd" min="1" max="1" step="1" value="1" aria-label="EURC abheben">
  <button id="wdB">Abheben</button>
  <button class="sec" id="wdAll">Alles abheben</button>
  <p class="mute">Geht an deine eigene Wallet.</p>
</section>

<p class="mute" id="kasse" style="text-align:center"></p>
<p class="mute" style="text-align:center"><button type="button" id="network" class="sm"></button></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== KONFIG ===== (Mainnet keylos über publicnode; Devnet über den Solana-Devnet-RPC) */
const store={get:k=>{try{return localStorage.getItem(k)}catch{}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const selectedNet=(typeof location!=='undefined'?new URLSearchParams(location.search).get('net'):null)||store.get('scoop.net');
const NET=selectedNet==='mainnet'?'mainnet':'devnet';
const NETS={
  devnet:{rpc:'https://api.devnet.solana.com',chain:'solana:devnet',eurc:'BHDWiNzzgPkNj8gX9SZU7U6fywJhrSK99hBC9A3tbR9f',cl:'?cluster=devnet'},
  mainnet:{rpc:'https://solana-rpc.publicnode.com',chain:'solana:mainnet',eurc:'HzwqbKZw8HxMN6bF2yFZNrht3c2iXXzpKcFu7uBEDKtr',cl:''}
};
const N=NETS[NET];
const PROG='7QzEwf8ZRRjikZAyL2jPs8RsUKxQh2cwNHCMu6bPiWiL';
const CONFIG='FBLDbjc7tG7YZJMMvnNFnK2Q1iquNPjJ4mHiv47Ufqsk';
const MINT='J9nHG1LgzTiHLZPqxtZcJ9eJapTSWhUGzkVj8Up84nXT';
const VAULT='BVibkWi4cpBnyxLj5kb421VUND1BcgnmBTvZdV7ksQQ';
const TOKEN='TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA';
const T22='TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb';
const ATAP='ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL';
const PD='FhoBCPQZeFvQaYXjgo4maVNAYxCUXzeCrDxS8gZr4x1c';
const SYS='11111111111111111111111111111111';
const DISC={buy:'00b835872e6bbae5',pay:'60433ef6cc01bffe',wd:'723148b81b9cf39b'};
const HALF=500000n;            // 0,5 SCOOP in Basiseinheiten
const CUP=2500000n;            // 1 Tasse = 2,5 SCOOP
const RATE=10000000n;          // fest: 1 EURC = 10 SCOOP (1 SCOOP = 0,10 EURC)

/* ===== Kern: Base58, PDA, Transaktion (ohne Fremdbibliothek) ===== */
const AL='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const b58d=s=>{let n=0n;for(const c of s)n=n*58n+BigInt(AL.indexOf(c));let h=n.toString(16);if(h.length%2)h='0'+h;const b=n===0n?[]:h.match(/../g).map(x=>parseInt(x,16));let z=0;while(s[z]==='1')z++;return Uint8Array.from([...Array(z).fill(0),...b])};
const b58e=b=>{let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=AL[Number(n%58n)]+s;n/=58n}for(const x of b){if(x)break;s='1'+s}return s};
const cat=(...a)=>{const o=new Uint8Array(a.reduce((t,x)=>t+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const P=2n**255n-19n,mod=a=>((a%P)+P)%P;
const pw=(b,e)=>{let r=1n;b=mod(b);while(e>0n){if(e&1n)r=mod(r*b);b=mod(b*b);e>>=1n}return r};
const D=mod(-121665n*pw(121666n,P-2n));
function onCurve(b){let y=0n;for(let i=31;i>=0;i--)y=(y<<8n)|BigInt(b[i]);y=mod(y&((1n<<255n)-1n));
  const y2=mod(y*y),u=mod(y2-1n),v=mod(D*y2+1n),v3=mod(v*v*v),v7=mod(v3*v3*v);
  const x=mod(u*v3*pw(u*v7,(P-5n)/8n)),t=mod(v*x*x);return t===u||t===mod(-u)}
async function findPda(seeds,prog){const pb=b58d(prog),sfx=new TextEncoder().encode('ProgramDerivedAddress');
  for(let bump=255;bump>=0;bump--){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',cat(...seeds,Uint8Array.of(bump),pb,sfx)));if(!onCurve(h))return b58e(h)}throw Error('kein PDA')}
const ata=(owner,mint,tp)=>findPda([b58d(owner),b58d(tp),b58d(mint)],ATAP);
const cu=n=>{const o=[];for(;;){const b=n&127;n>>=7;if(n)o.push(b|128);else{o.push(b);return o}}};
function buildTx(payer,ixs,bh){
  const m=new Map(),add=(k,s,w)=>{const o=m.get(k)||{k,s:0,w:0};o.s|=s;o.w|=w;m.set(k,o)};
  add(payer,1,1);for(const i of ixs){for(const a of i.keys)add(a.k,a.s?1:0,a.w?1:0);add(i.prog,0,0)}
  const rank=a=>a.s&&a.w?0:a.s?1:a.w?2:3,L=[...m.values()].sort((a,b)=>rank(a)-rank(b)),ix=k=>L.findIndex(a=>a.k===k);
  const nS=L.filter(a=>a.s).length,roS=L.filter(a=>a.s&&!a.w).length,roN=L.filter(a=>!a.s&&!a.w).length;
  const parts=[Uint8Array.of(nS,roS,roN),Uint8Array.from(cu(L.length)),...L.map(a=>b58d(a.k)),bh,Uint8Array.from(cu(ixs.length))];
  for(const i of ixs)parts.push(Uint8Array.of(ix(i.prog)),Uint8Array.from(cu(i.keys.length)),Uint8Array.from(i.keys.map(a=>ix(a.k))),Uint8Array.from(cu(i.data.length)),i.data);
  return cat(Uint8Array.of(1),new Uint8Array(64),...parts)}
const u64=n=>{const b=new Uint8Array(8);new DataView(b.buffer).setBigUint64(0,n,true);return b};
const hex=h=>Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)));
const K=(k,s,w)=>({k,s,w});
const ixAta=(me,ataK,mint=MINT,tp=T22)=>({prog:ATAP,data:Uint8Array.of(1),keys:[K(me,1,1),K(ataK,0,1),K(me,0,0),K(mint,0,0),K(SYS,0,0),K(tp,0,0)]});
const ixWd=(me,to,amt)=>({prog:PROG,data:cat(hex(DISC.wd),u64(amt)),keys:[K(me,1,0),K(PD,0,0),K(CONFIG,0,0),K(N.eurc,0,0),K(VAULT,0,1),K(to,0,1),K(TOKEN,0,0)]});
const ixBuy=(me,uU,uS,amt)=>({prog:PROG,data:cat(hex(DISC.buy),u64(amt)),keys:[K(me,1,0),K(CONFIG,0,0),K(N.eurc,0,0),K(MINT,0,1),K(uU,0,1),K(uS,0,1),K(VAULT,0,1),K(TOKEN,0,0),K(T22,0,0)]});
const ixPay=(me,uS,amt)=>({prog:PROG,data:cat(hex(DISC.pay),u64(amt)),keys:[K(me,1,0),K(MINT,0,1),K(uS,0,1),K(T22,0,0)]});

/* ===== UI ===== */
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const de=(n,d=2)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const sc=x=>de(Number(x)/1e6);
let wallets=[],W,acct,me,uS,uU,S={ok:false},busy=false;

const rpc=async(method,params=[])=>{const r=await fetch(N.rpc,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error)throw Error(j.error.message);return j.result};
const raw=async key=>{try{const r=await rpc('getAccountInfo',[key,{encoding:'base64'}]);const b=r&&r.value&&r.value.data&&r.value.data[0];return b?Uint8Array.from(atob(b),c=>c.charCodeAt(0)):null}catch{return null}};
const u64=(d,off)=>new DataView(d.buffer,d.byteOffset+off,8).getBigUint64(0,true);
let tt;const toast=(msg,cls='',link)=>{const t=$('toast');t.className=cls;t.innerHTML='';t.append(msg);if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener';a.textContent=' Details';t.append(a)}t.style.display='block';clearTimeout(tt);if(cls)tt=setTimeout(()=>t.style.display='none',9000)};

/* Wallet Standard */
const api={register:(...ws)=>{for(const w of ws)if(w.features['solana:signAndSendTransaction']&&w.features['standard:connect']&&!wallets.includes(w))wallets.push(w);drawWallets();const last=store.get('scoop.w'),w=wallets.find(x=>x.name===last);if(w&&!me)connect(w,true);return()=>{}}};
addEventListener('wallet-standard:register-wallet',e=>e.detail(api));
dispatchEvent(new CustomEvent('wallet-standard:app-ready',{detail:api}));
function drawWallets(){const c=$('connect');if(me){c.classList.add('hide');return}c.classList.remove('hide');c.innerHTML='';
  const h=document.createElement('p');h.className='mute';h.textContent=wallets.length?'Wähle deine Wallet':'Keine Wallet gefunden. Am Handy: Seite im Browser deiner Wallet-App öffnen.';c.append(h);
  for(const w of wallets){const b=document.createElement('button');b.textContent='Mit '+w.name+' verbinden';b.onclick=()=>connect(w);c.append(b)}
  if(!wallets.length){const u=encodeURIComponent(location.href),o=encodeURIComponent(location.origin);
    for(const [n,l] of [['Phantom','https://phantom.app/ul/browse/'+u+'?ref='+o],['Solflare','https://solflare.com/ul/v1/browse/'+u+'?ref='+o]]){const a=document.createElement('button');a.textContent='In '+n+' öffnen';a.onclick=()=>location.href=l;c.append(a)}}}
let unsub;
async function use(w,a){W=w;acct=a;me=a.address;S={ok:false};[uS,uU]=await Promise.all([ata(me,MINT,T22),ata(me,N.eurc,TOKEN)]);
  $('who').textContent=me.slice(0,4)+'…'+me.slice(-4)+' · wechseln';$('who').classList.remove('hide');$('bal').classList.remove('hide');drawWallets();
  $('cups').textContent='–';$('scoops').textContent='';$('admCard').classList.add('hide');$('bad').classList.add('hide');
  $('cup').value=store.get('scoop.cup.'+me)||5;sliders();await load()}
function reset(){me=W=null;S={ok:false};if(unsub)unsub();unsub=null;for(const id of ['who','bal','admCard','bad'])$(id).classList.add('hide');
  for(const id of ['payCard','buyCard'])$(id).classList.add('off');$('hints').innerHTML='';$('kasse').textContent='';drawWallets()}
async function leave(){const w=W;store.set('scoop.w','');reset();try{await w.features['standard:disconnect']?.disconnect()}catch{}
  toast('Getrennt. Konto in der Wallet wechseln und hier neu verbinden.')}
async function connect(w,silent){try{const r=await w.features['standard:connect'].connect(silent?{silent:true}:undefined);const a=r.accounts[0]||w.accounts[0];if(!a)return;
  store.set('scoop.w',w.name);await use(w,a);
  const ev=w.features['standard:events'];if(ev){if(unsub)unsub();unsub=ev.on('change',p=>{if(!p.accounts||W!==w)return;const n=p.accounts[0];if(!n)reset();else if(n.address!==me)use(w,n)})}
  }catch(e){if(!me&&!silent)toast('Verbinden abgebrochen','err')}}

async function load(){try{const bal=a=>raw(a).then(d=>d?u64(d,64):0n);
  const [s,u,sol,cfg,vault,sup,adm]=await Promise.all([bal(uS),bal(uU),rpc('getBalance',[me]).then(r=>r.value),
    raw(CONFIG).then(d=>{if(!d)throw Error('Konfiguration nicht gefunden.');return{mint:b58e(d.slice(8,40)),rate:u64(d,40)}}),
    bal(VAULT),raw(MINT).then(d=>{if(!d)throw Error('Mint nicht gefunden.');return u64(d,36)}),
    raw(PD).then(d=>!!d&&d[12]===1&&b58e(d.slice(13,45))===me)]);
  S={s,u,sol,rate:cfg.rate,mint:cfg.mint,vault,sup,adm,ok:cfg.mint===N.eurc&&cfg.rate===RATE};draw()}catch(e){S.ok=false;toast('Kontostand konnte nicht geladen werden. Bitte Seite neu laden.','err')}}

const cupAmt=()=>BigInt($('cup').value)*HALF,buyAmt=()=>BigInt($('buy').value)*1000000n;
function sliders(){const c=cupAmt();$('cupV').textContent=de(Number(c)/1e6,1)+' Löffel';$('pay').textContent='☕ '+de(Number(c)/1e6,1)+' SCOOP verbuchen';
  $('buyV').textContent=$('buy').value+' EURC';$('wdV').textContent=$('wd').value+' EURC';
  const g=buyAmt()*RATE/1000000n;$('buyP').textContent='→ '+sc(g)+' SCOOP ≈ '+de(Number(g)/Number(CUP),0)+' Tassen'}
function draw(){
  const bad=!S.ok;
  if(bad){$('badMsg').textContent='Die Kasse nutzt '+(S.mint?S.mint.slice(0,4)+'…'+S.mint.slice(-4):'–')+' mit Kurs '+sc(S.rate||0n)+' – erwartet: '+N.eurc.slice(0,4)+'… bei 10 SCOOP/EURC. Aufladen und Abheben sind gesperrt.';
    $('bad').classList.remove('hide')}else $('bad').classList.add('hide');
  $('admCard').classList.toggle('hide',!S.adm||bad);
  $('wd').max=Math.max(1,Number((S.vault||0n)/1000000n));sliders();
  $('cups').textContent=de(Number(S.s||0n)/Number(CUP),1);
  $('scoops').textContent=sc(S.s||0n)+' SCOOP · '+sc(S.u||0n)+' EURC';
  $('payCard').classList.remove('off');
  if(bad)$('buyCard').classList.add('off');else $('buyCard').classList.remove('off');
  for(const id of ['buyB','wdB','wdAll'])$(id).disabled=bad||busy;
  const h=[];if(bad)h.push('Die Kasse ist noch nicht auf EURC mit festem Kurs 10 SCOOP/EURC umgestellt.');
  else{if(S.sol<3000000)h.push('Du brauchst etwas SOL für Gebühren (ca. 0,01 SOL).');if(S.u===0n)h.push('Auf dieser Wallet liegt kein EURC.')}
  $('hints').innerHTML=h.map(x=>'<div class="hint">'+x+'</div>').join('');
  $('kasse').textContent='Kasse: '+sc(S.vault||0n)+' EURC · im Umlauf: '+sc(S.sup||0n)+' SCOOP · 1 SCOOP = 0,10 EURC'}

async function send(ixs){const bh=(await rpc('getLatestBlockhash',[{commitment:'confirmed'}])).value.blockhash;
  const tx=buildTx(me,ixs,b58d(bh));
  const [{signature}]=await W.features['solana:signAndSendTransaction'].signAndSendTransaction({account:acct,chain:N.chain,transaction:tx});
  const sig=b58e(signature);
  for(let i=0;i<40;i++){await sleep(1500);const s=(await rpc('getSignatureStatuses',[[sig]])).value[0];if(s){if(s.err)throw Error('Die Transaktion wurde abgelehnt.');if(s.confirmationStatus!=='processed')return sig}}
  throw Error('Keine Bestätigung erhalten – bitte Guthaben prüfen.')}
async function act(msg,fn,ok){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);toast('Bitte in der Wallet bestätigen …');
  try{const sig=await fn();await load();toast(ok(),'ok','https://explorer.solana.com/tx/'+sig+N.cl)}
  catch(e){toast(/reject|denied|cancel/i.test(e.message)?'Abgebrochen.':e.message,'err')}
  finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);if(me)draw()}}

$('pay').onclick=()=>{const a=cupAmt();if(S.s<a)return toast('Zu wenig SCOOP – bitte erst aufladen.','err');
  act('',()=>send([ixPay(me,uS,a)]),()=>'☕ Verbucht! Noch '+de(Number(S.s)/Number(CUP),1)+' Tassen übrig.')};
$('buyB').onclick=()=>{if(!S.ok)return toast('Kasse nicht auf EURC umgestellt – Aufladen gesperrt.','err');
  const a=buyAmt();if(S.u<a)return toast('Du hast nur '+sc(S.u)+' EURC.','err');
  act('',()=>send([ixAta(me,uS),ixBuy(me,uU,uS,a)]),()=>'✅ Aufgeladen! Du hast jetzt '+de(Number(S.s)/Number(CUP),1)+' Tassen.')};
const wd=a=>{if(!S.ok)return toast('Kasse nicht auf EURC umgestellt – Abheben gesperrt.','err');
  if(a<=0n||a>S.vault)return toast('So viel liegt nicht in der Kasse.','err');
  if(confirm('Wirklich '+sc(a)+' EURC an deine Wallet abheben?'))act('',()=>send([ixAta(me,uU,N.eurc,TOKEN),ixWd(me,uU,a)]),()=>'✅ '+sc(a)+' EURC abgehoben.')};
$('wdB').onclick=()=>wd(BigInt($('wd').value)*1000000n);$('wdAll').onclick=()=>wd(S.vault);
$('save').onclick=()=>{store.set('scoop.cup.'+me,$('cup').value);toast('★ Gespeichert: '+de(Number(cupAmt())/1e6,1)+' SCOOP ist jetzt deine Tasse.','ok')};
for(const id of ['cup','buy','wd'])$(id).oninput=sliders;
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const r=$(b.dataset.s);r.value=+r.value+ +b.dataset.d;sliders()});
$('who').onclick=leave;
$('network').textContent='Netz: '+(NET==='mainnet'?'Mainnet':'Devnet')+' ⇄';
$('network').setAttribute('aria-label','Netz: '+(NET==='mainnet'?'Mainnet. Zu Devnet wechseln':'Devnet. Zu Mainnet wechseln'));
$('network').onclick=()=>{if(busy)return;const next=NET==='mainnet'?'devnet':'mainnet';store.set('scoop.net',next);const url=new URL(location.href);url.searchParams.set('net',next);location.assign(url.href)};
if(NET!=='mainnet')$('net').classList.remove('hide');
$('cup').value=5;sliders();drawWallets();
}
</script>
</body>
</html>
